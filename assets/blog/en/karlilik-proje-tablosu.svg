<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="312" rx="14" fill="#0F172A"/><text x="30" y="40" font-size="17" fill="#F1F5F9" font-weight="700" text-anchor="start">What did each project earn?</text><text x="30" y="62" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">Example: four projects in one year, amounts in EUR thousand</text><text x="30" y="94" font-size="11.5" fill="#94A3B8" font-weight="600" text-anchor="start">Project</text><text x="400" y="94" font-size="11.5" fill="#94A3B8" font-weight="600" text-anchor="end">Revenue</text><text x="500" y="94" font-size="11.5" fill="#94A3B8" font-weight="600" text-anchor="end">Cost</text><text x="600" y="94" font-size="11.5" fill="#94A3B8" font-weight="600" text-anchor="end">Profit</text><text x="700" y="94" font-size="11.5" fill="#94A3B8" font-weight="600" text-anchor="end">Margin</text><rect x="20" y="106" width="720" height="32" rx="8" fill="#111827" stroke="#1E293B"/><text x="30" y="127" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Factory electrical works</text><text x="400" y="127" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="end">2.400</text><text x="500" y="127" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="end">2.050</text><text x="600" y="127" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">+350</text><text x="700" y="127" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">15%</text><rect x="20" y="146" width="720" height="32" rx="8" fill="#111827" stroke="#1E293B"/><text x="30" y="167" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">School automation system</text><text x="400" y="167" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="end">900</text><text x="500" y="167" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="end">720</text><text x="600" y="167" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">+180</text><text x="700" y="167" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">20%</text><rect x="20" y="186" width="720" height="32" rx="8" fill="#111827" stroke="#7F1D1D"/><text x="30" y="207" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Mall mechanical works</text><text x="400" y="207" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="end">3.800</text><text x="500" y="207" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="end">3.870</text><text x="600" y="207" font-size="13" fill="#F87171" font-weight="600" text-anchor="end">−70</text><text x="700" y="207" font-size="13" fill="#F87171" font-weight="600" text-anchor="end">−2%</text><rect x="20" y="226" width="720" height="32" rx="8" fill="#111827" stroke="#1E293B"/><text x="30" y="247" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Warehouse lighting</text><text x="400" y="247" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="end">600</text><text x="500" y="247" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="end">510</text><text x="600" y="247" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">+90</text><text x="700" y="247" font-size="13" fill="#34D399" font-weight="600" text-anchor="end">15%</text><text x="30" y="292" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">The job with the most revenue lost money. The year-end total will never show you that.</text></svg>