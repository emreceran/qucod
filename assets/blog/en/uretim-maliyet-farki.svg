<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="284" rx="14" fill="#0F172A"/><text x="30" y="40" font-size="17" fill="#F1F5F9" font-weight="700" text-anchor="start">Same order, two different sums</text><text x="30" y="62" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">Example: a job sold for EUR 100,000</text><text x="30" y="96" font-size="13" fill="#F1F5F9" font-weight="600" text-anchor="start">Calculated when quoting</text><rect x="30" y="108" width="560" height="30" rx="6" fill="#1E293B"/><rect x="30.0" y="108" width="324.8" height="30" fill="#6366F1"/><text x="192.39999999999998" y="128" font-size="12" fill="#0A0E1A" font-weight="700" text-anchor="middle">Materials 58</text><rect x="354.8" y="108" width="123.2" height="30" fill="#22D3EE"/><text x="416.4" y="128" font-size="12" fill="#0A0E1A" font-weight="700" text-anchor="middle">Labour 22</text><text x="606" y="128" font-size="13.5" fill="#34D399" font-weight="700" text-anchor="start">Left over: EUR 20k</text><text x="30" y="180" font-size="13" fill="#F1F5F9" font-weight="600" text-anchor="start">What it came to at the end</text><rect x="30" y="192" width="560" height="30" rx="6" fill="#1E293B"/><rect x="30.0" y="192" width="352.8" height="30" fill="#6366F1"/><text x="206.39999999999998" y="212" font-size="12" fill="#0A0E1A" font-weight="700" text-anchor="middle">Materials 63</text><rect x="382.8" y="192" width="151.2" height="30" fill="#22D3EE"/><text x="458.4" y="212" font-size="12" fill="#0A0E1A" font-weight="700" text-anchor="middle">Labour 27</text><rect x="534.0" y="192" width="33.6" height="30" fill="#F87171"/><text x="606" y="212" font-size="13.5" fill="#FBBF24" font-weight="700" text-anchor="start">Left over: EUR 4k</text><text x="30" y="262" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">Figures are illustrative. If scrap and overtime go unrecorded, the gap only shows at year end.</text></svg>