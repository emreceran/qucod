<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="272" rx="14" fill="#0F172A"/><text x="30" y="40" font-size="17" fill="#F1F5F9" font-weight="700" text-anchor="start">The path of one order</text><text x="30" y="62" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">At every step the information lives somewhere else</text><rect x="30" y="88" width="124" height="56" rx="10" fill="#111827" stroke="#6366F1"/><text x="92" y="122" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="middle">Quote</text><path d="M156 116 h10 m-5 -5 l5 5 l-5 5" stroke="#22D3EE" stroke-width="2" fill="none"/><line x1="92" y1="144" x2="92" y2="172" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="30" y="172" width="124" height="44" rx="10" fill="#1F1418" stroke="#7F1D1D"/><text x="92" y="199" font-size="12" fill="#FCA5A5" font-weight="500" text-anchor="middle">Excel file</text><rect x="172" y="88" width="124" height="56" rx="10" fill="#111827" stroke="#6366F1"/><text x="234" y="122" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="middle">Order</text><path d="M298 116 h10 m-5 -5 l5 5 l-5 5" stroke="#22D3EE" stroke-width="2" fill="none"/><line x1="234" y1="144" x2="234" y2="172" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="172" y="172" width="124" height="44" rx="10" fill="#1F1418" stroke="#7F1D1D"/><text x="234" y="199" font-size="12" fill="#FCA5A5" font-weight="500" text-anchor="middle">WhatsApp message</text><rect x="314" y="88" width="124" height="56" rx="10" fill="#111827" stroke="#6366F1"/><text x="376" y="122" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="middle">Materials</text><path d="M440 116 h10 m-5 -5 l5 5 l-5 5" stroke="#22D3EE" stroke-width="2" fill="none"/><line x1="376" y1="144" x2="376" y2="172" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="314" y="172" width="124" height="44" rx="10" fill="#1F1418" stroke="#7F1D1D"/><text x="376" y="199" font-size="12" fill="#FCA5A5" font-weight="500" text-anchor="middle">Storekeeper's notebook</text><rect x="456" y="88" width="124" height="56" rx="10" fill="#111827" stroke="#6366F1"/><text x="518" y="122" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="middle">Manufacturing</text><path d="M582 116 h10 m-5 -5 l5 5 l-5 5" stroke="#22D3EE" stroke-width="2" fill="none"/><line x1="518" y1="144" x2="518" y2="172" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="456" y="172" width="124" height="44" rx="10" fill="#1F1418" stroke="#7F1D1D"/><text x="518" y="199" font-size="12" fill="#FCA5A5" font-weight="500" text-anchor="middle">Paper work order</text><rect x="598" y="88" width="124" height="56" rx="10" fill="#111827" stroke="#6366F1"/><text x="660" y="122" font-size="15" fill="#F1F5F9" font-weight="600" text-anchor="middle">Shipping</text><line x1="660" y1="144" x2="660" y2="172" stroke="#94A3B8" stroke-dasharray="3 3"/><rect x="598" y="172" width="124" height="44" rx="10" fill="#1F1418" stroke="#7F1D1D"/><text x="660" y="199" font-size="12" fill="#FCA5A5" font-weight="500" text-anchor="middle">Phone</text><text x="30" y="250" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">Red boxes: where the information sits today. Five steps, five separate records, none linked.</text></svg>