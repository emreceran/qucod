<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="360" rx="14" fill="#0F172A"/><text x="30" y="40" font-size="17" fill="#F1F5F9" font-weight="700" text-anchor="start">A project's budget versus actual</text><text x="30" y="62" font-size="13" fill="#94A3B8" font-weight="400" text-anchor="start">Example: a EUR 1 million job, amounts in EUR thousand</text><text x="30" y="106" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Materials</text><rect x="210" y="88" width="380" height="11" rx="4" fill="#6366F1"/><text x="596.0" y="98" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">400</text><rect x="210" y="103" width="408" height="11" rx="4" fill="#F87171"/><text x="624.5" y="113" font-size="11.5" fill="#FCA5A5" font-weight="400" text-anchor="start">430</text><text x="30" y="148" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Labour</text><rect x="210" y="130" width="238" height="11" rx="4" fill="#6366F1"/><text x="453.5" y="140" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">250</text><rect x="210" y="145" width="304" height="11" rx="4" fill="#F87171"/><text x="520.0" y="155" font-size="11.5" fill="#FCA5A5" font-weight="400" text-anchor="start">320</text><text x="30" y="190" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Subcontract</text><rect x="210" y="172" width="142" height="11" rx="4" fill="#6366F1"/><text x="358.5" y="182" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">150</text><rect x="210" y="187" width="142" height="11" rx="4" fill="#22D3EE"/><text x="358.5" y="197" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">150</text><text x="30" y="232" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Transport, lodging</text><rect x="210" y="214" width="38" height="11" rx="4" fill="#6366F1"/><text x="254.0" y="224" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">40</text><rect x="210" y="229" width="71" height="11" rx="4" fill="#F87171"/><text x="287.25" y="239" font-size="11.5" fill="#FCA5A5" font-weight="400" text-anchor="start">75</text><text x="30" y="274" font-size="13" fill="#F1F5F9" font-weight="500" text-anchor="start">Extra work outside contract</text><rect x="210" y="256" width="2" height="11" rx="4" fill="#6366F1"/><text x="216.0" y="266" font-size="11.5" fill="#94A3B8" font-weight="400" text-anchor="start">0</text><rect x="210" y="271" width="57" height="11" rx="4" fill="#F87171"/><text x="273.0" y="281" font-size="11.5" fill="#FCA5A5" font-weight="400" text-anchor="start">60</text><rect x="30" y="304" width="22" height="9" rx="4" fill="#6366F1"/><text x="60" y="313" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">Budget: 840</text><rect x="160" y="304" width="22" height="9" rx="4" fill="#F87171"/><text x="190" y="313" font-size="12" fill="#94A3B8" font-weight="400" text-anchor="start">Actual: 1,035</text><text x="30" y="340" font-size="12.5" fill="#94A3B8" font-weight="400" text-anchor="start">Expected profit was EUR 160k. The job closed at a EUR 35k loss and nobody saw it while it ran.</text></svg>